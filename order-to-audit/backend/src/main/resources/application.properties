# Default profile = MySQL. Override with environment variables.
spring.application.name=order-to-audit

spring.datasource.url=jdbc:mysql://localhost:3306/order_to_audit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=2410

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (override APP_JWT_SECRET in any real deployment; must be 32+ chars)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=480

# Seller details printed on GST invoices. state-code decides CGST+SGST (same state) vs IGST.
app.company.name=Sri Lakshmi Snacks
app.company.gstin=33ABCDE1234F1Z5
app.company.address=Madurai, Tamil Nadu
app.company.state-code=33

# A production run is flagged when yield or any material deviates by more than this (%)
app.production.yield-tolerance-pct=3

# Create demo users (one per role) on first start
app.seed.demo-users=${APP_SEED_DEMO_USERS:true}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:Passw0rd!}
